<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ VIBE — мессенджер 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== ЭКРАН АВТОРИЗАЦИИ ===== -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-logo">
                <svg viewBox="0 0 100 100" width="64" height="64">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#g)" stroke-width="6"/>
                    <path d="M35 50 L45 60 L70 35" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff6fd8"/>
                            <stop offset="100%" stop-color="#6f8cff"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>✦ VIBE</h1>
                <p>Мессенджер 2026</p>
            </div>

            <!-- Вход -->
            <div id="loginForm" class="auth-form">
                <h2>Вход</h2>
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
                <button id="loginBtn" class="auth-btn">Войти</button>
                <p class="auth-switch">
                    Нет аккаунта? <span id="showRegister">Зарегистрироваться</span>
                </p>
                <div id="loginError" class="auth-error"></div>
            </div>

            <!-- Регистрация -->
            <div id="registerForm" class="auth-form" style="display:none;">
                <h2>Регистрация</h2>
                <input type="text" id="registerUsername" placeholder="Имя пользователя">
                <input type="email" id="registerEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="registerPassword" placeholder="Пароль (мин. 6 символов)" autocomplete="new-password">
                <button id="registerBtn" class="auth-btn">Создать аккаунт</button>
                <p class="auth-switch">
                    Уже есть аккаунт? <span id="showLogin">Войти</span>
                </p>
                <div id="registerError" class="auth-error"></div>
            </div>
        </div>
    </div>

    <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
    <div id="appScreen" class="app" style="display:none;">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo">
                <svg viewBox="0 0 100 100" width="42" height="42">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#g)" stroke-width="6"/>
                    <path d="M35 50 L45 60 L70 35" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff6fd8"/>
                            <stop offset="100%" stop-color="#6f8cff"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span>VIBE</span>
            </div>

            <div class="connection-status" id="connectionStatus">
                <span class="dot"></span>
                <span>Подключено</span>
            </div>

            <div class="search-box">
                <input type="text" placeholder="Поиск..." id="searchInput">
            </div>

            <div class="contacts" id="contactsList">
                <div class="no-contacts">
                    <span>👋 Начни общение</span>
                    <span class="sub">Добавь контакты через Firebase</span>
                </div>
            </div>

            <div class="user-profile">
                <div class="avatar" id="userAvatar" style="background: #a06bff;">Я</div>
                <div class="info">
                    <div class="name" id="userName">Пользователь</div>
                    <div class="status" id="userEmail">email@example.com</div>
                </div>
                <button id="logoutBtn" class="logout-btn">🚪</button>
            </div>
        </aside>

        <!-- Основной чат -->
        <main class="chat">
            <header class="chat-header">
                <div class="chat-user">
                    <div class="avatar" style="background: #ff6fd8;" id="chatAvatar">А</div>
                    <div class="info">
                        <div class="name" id="chatName">Выбери чат</div>
                        <div class="status" id="chatStatus">выбери контакт</div>
                    </div>
                </div>
                <div class="chat-actions">
                    <button>📞</button>
                    <button>📹</button>
                    <button id="clearChatBtn">🗑️</button>
                </div>
            </header>

            <div class="messages" id="messagesContainer">
                <div class="empty-chat">
                    <span>💬 Выбери контакт</span>
                    <span class="sub">Начни общение с друзьями</span>
                </div>
            </div>

            <div class="message-input">
                <button id="emojiBtn">😊</button>
                <input type="text" id="messageInput" placeholder="Напиши сообщение..." autofocus>
                <button id="sendBtn">➤</button>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- Конфигурация Firebase -->
    <script src="firebase-config.js"></script>
    
    <!-- Основной скрипт -->
    <script src="script.js"></script>
</body>
</html>
